services:
  migrate:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://creator:creator@db:5432/creator}"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://creator:creator@db:5432/creator}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://creator:creator@db:5432/creator}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "generations"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creator
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
