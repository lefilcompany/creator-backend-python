[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-backend"
version = "0.1.0"
description = "Contract-first backend for Creator"
requires-python = ">=3.12,<3.14"
dependencies = [
  "crewai>=1.15,<2",
  "fastapi>=0.115,<1",
  "google-genai>=1.54,<2",
  "langchain>=1,<2",
  "langchain-chroma>=1,<2",
  "langchain-google-genai>=4,<5",
  "Pillow>=12,<13",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "redis>=5,<6",
  "rq>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["creator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=creator --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true
